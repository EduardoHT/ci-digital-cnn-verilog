name: Importar projeto preparado

on:
  workflow_dispatch:
  push:
    paths:
      - ci-digital-cnn-verilog-upload.zip

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Descompactar e publicar os arquivos
        shell: bash
        run: |
          unzip -q ci-digital-cnn-verilog-upload.zip -d .
          rm ci-digital-cnn-verilog-upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica projeto CI Digital completo"
          git push
